spring.application.name=ecommerce-api

# Połączenie z bazą PostgreSQL z Dockera
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=lukasz
spring.datasource.password=password

# Tworzenie schematu bazy automatycznie z naszych encji (na deweloperce)
spring.jpa.hibernate.ddl-auto=update

# Pokazywanie zapytań SQL w konsoli (przydatne do debugowania)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
